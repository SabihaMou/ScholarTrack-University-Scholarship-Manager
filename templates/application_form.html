{% extends 'base.html' %}{% block heading %}{{'Edit application' if item else 'New application'}}{% endblock %}{% block content %}<section class="panel formpanel"><div class="sectiontitle"><div><h2>{{'Update your university' if item else 'Add a university'}}</h2><p>Capture the details that matter for this application.</p></div></div><form method="post" class="form gridform"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>University name *<input required maxlength="160" name="university" value="{{item.university if item else ''}}" placeholder="e.g. Northbridge University"></label><label>Degree program *<input required maxlength="160" name="program" value="{{item.program if item else ''}}" placeholder="e.g. MSc Computer Science"></label><label>Country<input name="country" maxlength="90" value="{{item.country if item else ''}}" placeholder="Country"></label><label>Degree level<select name="degree">{% for d in ['Bachelors','Masters','PhD','Diploma','Other'] %}<option {% if item and item.degree==d %}selected{% endif %}>{{d}}</option>{% endfor %}</select></label><label>Application status<select name="status">{% for s in statuses %}<option {% if item and item.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label><label>Deadline<input type="date" name="deadline" value="{{item.deadline.isoformat() if item and item.deadline else ''}}"></label><label class="wide">Official application URL<input type="url" name="link" value="{{item.link if item else ''}}" placeholder="https://..."></label><label class="wide">Notes<textarea name="notes" rows="5" placeholder="Requirements, contacts, next steps…">{{item.notes if item else ''}}</textarea></label><div class="wide actions"><button class="button primary">Save application</button><a class="button subtle" href="{{url_for('applications')}}">Cancel</a></div></form></section>{% endblock %}
