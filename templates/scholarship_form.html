{% extends 'base.html' %}{% block heading %}{{'Edit scholarship' if item else 'New scholarship'}}{% endblock %}{% block content %}<section class="panel formpanel"><h2>{{'Update scholarship' if item else 'Add funding opportunity'}}</h2><p class="muted">Save requirements, dates and application details.</p><form class="form gridform" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Scholarship name *<input required name="name" maxlength="160" value="{{item.name if item else ''}}"></label><label>Funding amount<input name="amount" maxlength="100" value="{{item.amount if item else ''}}" placeholder="e.g. Full tuition"></label><label>Related university<select name="application_id"><option value="">Not linked</option>{% for a in apps %}<option value="{{a.id}}" {% if item and item.application_id==a.id %}selected{% endif %}>{{a.university}}</option>{% endfor %}</select></label><label>Status<select name="status">{% for s in statuses %}<option {% if item and item.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label><label>Deadline<input type="date" name="deadline" value="{{item.deadline.isoformat() if item and item.deadline else ''}}"></label><label>Website<input type="url" name="link" value="{{item.link if item else ''}}" placeholder="https://..."></label><label class="wide">Notes<textarea rows="5" name="notes">{{item.notes if item else ''}}</textarea></label><div class="wide actions"><button class="button primary">Save scholarship</button><a class="button subtle" href="{{url_for('scholarships')}}">Cancel</a></div></form></section>{% endblock %}
